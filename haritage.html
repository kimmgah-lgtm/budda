<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국 불교 문화유산 연대기 탐험</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-hanji: #F7F3EA;
      --card-bg: #FFFDF8;
      --primary: #1F5B5B;      /* 청록 */
      --accent: #A94438;       /* 적갈색(단청) */
      --gold: #C28E42;         /* 황토/금색 */
      --ink: #2C2A29;          /* 먹색 */
      --muted: #6B655E;
      --border: #E2D9C8;
      --shadow: 0 4px 14px rgba(44, 42, 41, 0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-hanji);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* 헤더 */
    header {
      background: linear-gradient(135deg, #174646 0%, var(--primary) 100%);
      color: #FFFDF8;
      padding: 2.2rem 1.5rem 1.8rem;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    header h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.9rem;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 1.2rem;
    }

    /* 스탬프 진행률 바 */
    .progress-box {
      max-width: 540px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.14);
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
      gap: 0.5rem;
    }

    .progress-right {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .btn-reset-stamp {
      background: rgba(255, 255, 255, 0.18);
      color: #FFFDF8;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      font-size: 0.76rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset-stamp:hover {
      background: rgba(169, 68, 56, 0.85);
      border-color: rgba(255, 255, 255, 0.7);
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #E8B86D;
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    /* 메인 컨테이너 */
    main {
      max-width: 1020px;
      margin: 0 auto;
      padding: 1.5rem 1.2rem 4rem;
    }

    /* 상단 탭 (연대기 / 퀴즈) */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 0.7rem;
      margin-bottom: 1.5rem;
    }

    .nav-tab {
      padding: 0.65rem 1.4rem;
      border: 1.5px solid var(--primary);
      background: var(--card-bg);
      color: var(--primary);
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-tab.active {
      background: var(--primary);
      color: #FFFDF8;
    }

    /* 필터 및 검색 영역 */
    .filter-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.15rem 1.3rem;
      margin-bottom: 1.8rem;
      box-shadow: var(--shadow);
    }

    .search-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.95rem;
      padding-bottom: 0.95rem;
      border-bottom: 1px dashed var(--border);
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      padding: 0.65rem 2.4rem 0.65rem 0.95rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #FAF6EE;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: #FFFDF8;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.15rem;
      cursor: pointer;
      display: none;
      padding: 0 4px;
    }

    .search-clear.visible { display: block; }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-row + .filter-row {
      margin-top: 0.85rem;
      padding-top: 0.85rem;
      border-top: 1px dashed var(--border);
    }

    .filter-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      min-width: 58px;
    }

    .chip {
      padding: 0.38rem 0.9rem;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: #FAF6EE;
      color: var(--ink);
      font-size: 0.86rem;
      cursor: pointer;
      transition: all 0.18s;
    }

    .chip:hover { border-color: var(--primary); }

    .chip.active-era {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 700;
    }

    .chip.active-cat {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* 연대기 리스트 */
    .timeline {
      position: relative;
      padding-left: 26px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 9px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      background: var(--border);
      border-radius: 2px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.1rem;
    }

    .era-section {
      margin-bottom: 2rem;
      position: relative;
    }

    .era-heading {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.2rem;
      color: var(--primary);
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .era-heading::before {
      content: '';
      position: absolute;
      left: -23px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg-hanji);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.15rem;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(31, 91, 91, 0.12);
    }

    .card-badges {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
    }

    .badge-era { background: #E6F0F0; color: var(--primary); }
    .badge-cat { background: #F8EAE8; color: var(--accent); }
    .badge-year { background: #F3ECE0; color: var(--muted); font-weight: 500; }

    .card h3 {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.12rem;
      margin-bottom: 0.45rem;
      color: var(--ink);
    }

    .card p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 600;
      border-top: 1px solid #F0E9DC;
      padding-top: 0.6rem;
    }

    /* 완료 스탬프 */
    .stamp-mark {
      position: absolute;
      top: 12px;
      right: 12px;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-family: 'Noto Serif KR', serif;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      transform: rotate(-8deg);
      background: rgba(255, 253, 248, 0.92);
      display: none;
    }

    .card.stamped .stamp-mark { display: block; }
    .card.stamped { border-color: #D8B4A0; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px dashed var(--border);
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(24, 22, 20, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--card-bg);
      max-width: 520px;
      width: 100%;
      border-radius: 16px;
      padding: 1.6rem;
      border: 2px solid var(--border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
      position: relative;
      animation: pop 0.2s ease-out;
    }

    @keyframes pop {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--muted);
      cursor: pointer;
    }

    .modal h2 {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.45rem;
      margin: 0.6rem 0 0.3rem;
    }

    .modal-meta {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .modal-desc {
      font-size: 0.96rem;
      line-height: 1.75;
      margin-bottom: 1.1rem;
      background: #FAF6EE;
      padding: 1rem;
      border-radius: 10px;
      border-left: 4px solid var(--primary);
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.3rem;
    }

    .keyword {
      font-size: 0.8rem;
      background: #EFE9DC;
      color: var(--ink);
      padding: 0.25rem 0.65rem;
      border-radius: 99px;
    }

    .btn-stamp {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-stamp:hover { background: #8E362B; }
    .btn-stamp.done { background: var(--primary); }

    /* 퀴즈 영역 */
    .quiz-box {
      max-width: 620px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      box-shadow: var(--shadow);
    }

    .quiz-status {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .quiz-question {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.2rem;
      margin-bottom: 1.3rem;
      line-height: 1.5;
    }

    .quiz-options {
      display: grid;
      gap: 0.65rem;
    }

    .quiz-opt {
      padding: 0.85rem 1rem;
      text-align: left;
      background: #FAF6EE;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .quiz-opt:hover:not(:disabled) { border-color: var(--primary); background: #EFF5F5; }
    .quiz-opt.correct { background: #E3F3EA; border-color: #2E7D52; color: #1E5638; font-weight: 700; }
    .quiz-opt.wrong { background: #FCEAEA; border-color: var(--accent); color: var(--accent); }

    .quiz-feedback {
      margin-top: 1rem;
      font-size: 0.92rem;
      font-weight: 600;
      min-height: 1.4rem;
    }

    .btn-next {
      margin-top: 1rem;
      padding: 0.7rem 1.4rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>한국 불교 문화유산 연대기 탐험</h1>
    <p>시대별 사찰 · 고찰 · 탑 · 승려 · 불상 · 불화를 한눈에 살펴보고 탐험 도장을 모아보세요.</p>
    <div class="progress-box">
      <div class="progress-top">
        <span>나의 탐험 스탬프</span>
        <div class="progress-right">
          <span id="progressText">0 / 20 완료</span>
          <button class="btn-reset-stamp" id="btnResetStamp" title="모든 탐험 스탬프 초기화">초기화</button>
        </div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </header>

  <main>
    <!-- 상단 탭 -->
   <!-- 상단 탭 -->
    <div class="nav-tabs">
      <a href="./index.html" class="nav-tab" style="text-decoration:none; display:inline-flex; align-items:center;">← 사찰·보물 7선</a>
      <button class="nav-tab active" data-tab="timeline">연대기 탐험</button>
      <button class="nav-tab" data-tab="quiz">연계 퀴즈 풀기</button>
    </div>

    <!-- 연대기 탭 -->
    <section id="tab-timeline">
      <div class="filter-panel">
        <!-- 검색창 -->
        <div class="search-row">
          <div class="search-input-wrap">
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="제목, 지역, 키워드 검색 (예: 불국사, 원효, 배흘림기둥, 경주)"
              autocomplete="off"
            />
            <button type="button" id="searchClear" class="search-clear" aria-label="검색어 지우기">&times;</button>
          </div>
        </div>

        <div class="filter-row" id="eraFilters">
          <span class="filter-label">시대별</span>
          <button class="chip active-era" data-era="전체">전체</button>
          <button class="chip" data-era="삼국시대">삼국시대</button>
          <button class="chip" data-era="통일신라">통일신라</button>
          <button class="chip" data-era="고려시대">고려시대</button>
          <button class="chip" data-era="조선시대">조선시대</button>
        </div>
        <div class="filter-row" id="catFilters">
          <span class="filter-label">주제별</span>
          <button class="chip active-cat" data-cat="전체">전체</button>
          <button class="chip" data-cat="사찰">사찰</button>
          <button class="chip" data-cat="고찰">고찰</button>
          <button class="chip" data-cat="탑">탑</button>
          <button class="chip" data-cat="승려">승려</button>
          <button class="chip" data-cat="불상">불상</button>
          <button class="chip" data-cat="불화">불화</button>
        </div>
      </div>

      <div id="timelineContainer"></div>
    </section>

    <!-- 퀴즈 탭 -->
    <section id="tab-quiz" class="hidden">
      <div class="quiz-box" id="quizBox">
        <div class="quiz-status">
          <span id="quizCounter">문제 1 / 5</span>
          <span id="quizScore">점수: 0</span>
        </div>
        <div class="quiz-question" id="quizQuestion"></div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <button class="btn-next" id="btnNextQuiz">다음 문제</button>
      </div>
    </section>
  </main>

  <!-- 상세 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="card-badges" id="modalBadges"></div>
      <h2 id="modalTitle"></h2>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="keywords" id="modalKeywords"></div>
      <button class="btn-stamp" id="btnStamp">탐험 완료 도장 찍기</button>
    </div>
  </div>

  <script>
    const DATA = [
      // ==================== 삼국시대 (5) ====================
      {
        id: "jeondeungsa",
        era: "삼국시대",
        category: "고찰",
        year: "381년 창건 (고구려 소수림왕)",
        title: "강화 전등사",
        location: "인천 강화군",
        summary: "우리나라에 현존하는 사찰 중 가장 오랜 역사를 지닌 대표 고찰입니다.",
        detail: "고구려 소수림왕 때 아도화상이 창건했다고 전해지며, 고려 시대 정화궁주가 옥등을 시주한 뒤 '전등사'라 불리게 되었습니다. 대웅전 처마 네 모서리의 나부상 전설로도 유명합니다.",
        keywords: ["현존 최고 사찰", "삼랑성", "대웅전 나부상"]
      },
      {
        id: "hwangnyongsa",
        era: "삼국시대",
        category: "사찰",
        year: "553년 창건 (신라 진흥왕)",
        title: "경주 황룡사",
        location: "경북 경주시",
        summary: "신라 최대 규모의 호국 사찰로, 거대한 구층목탑이 세워졌던 곳입니다.",
        detail: "진흥왕 때 궁궐을 짓다가 황룡이 나타나 사찰로 바꾸어 지었습니다. 선덕여왕 때 완성된 황룡사 구층목탑은 높이 약 80m에 달했으나 몽골 침입 때 불타 현재는 터만 남아 있습니다.",
        keywords: ["호국 사찰", "구층목탑", "신라 진흥왕"]
      },
      {
        id: "wongwang",
        era: "삼국시대",
        category: "승려",
        year: "542 ~ 640",
        title: "원광법사",
        location: "신라 경주 · 청도 운문사",
        summary: "화랑들의 행동 강령인 '세속오계'를 지어준 신라의 고승입니다.",
        detail: "중국 수나라에 유학하고 돌아와 신라 불교의 기틀을 다졌습니다. 젊은 화랑 귀산과 추항에게 충·효·신·용·살생유택을 담은 세속오계를 내려주어 신라 삼국 통일의 정신적 기반을 마련했습니다.",
        keywords: ["세속오계", "화랑도", "호국 불교"]
      },
      {
        id: "bangasayusang",
        era: "삼국시대",
        category: "불상",
        year: "6세기 후반 ~ 7세기 초",

    const ERA_ORDER = ["삼국시대", "통일신라", "고려시대", "조선시대"];
    let selectedEra = "전체";
    let selectedCat = "전체";
    let searchQuery = "";
    let currentModalId = null;

    // 스탬프 상태 (로컬스토리지 저장)
    let stampedIds = JSON.parse(localStorage.getItem("buddhism_stamps") || "[]");

    function saveStamps() {
      localStorage.setItem("buddhism_stamps", JSON.stringify(stampedIds));
      updateProgress();
    }

    function updateProgress() {
      const total = DATA.length;
      const done = stampedIds.filter(id => DATA.some(d => d.id === id)).length;
      document.getElementById("progressText").textContent = `${done} / ${total} 완료`;
      document.getElementById("progressFill").style.width = `${Math.round((done / total) * 100)}%`;
    }

    // 스탬프 초기화
    document.getElementById("btnResetStamp").addEventListener("click", () => {
      if (stampedIds.length === 0) {
        alert("아직 찍힌 탐험 스탬프가 없습니다.");
        return;
      }
      if (confirm("모아둔 탐험 스탬프를 모두 초기화할까요?")) {
        stampedIds = [];
        saveStamps();
        renderTimeline();
      }
    });

    // 검색창 이벤트
    const searchInput = document.getElementById("searchInput");
    const searchClear = document.getElementById("searchClear");

    searchInput.addEventListener("input", e => {
      searchQuery = e.target.value.trim().toLowerCase();
      searchClear.classList.toggle("visible", searchQuery.length > 0);
      renderTimeline();
    });

    searchClear.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      searchClear.classList.remove("visible");
      searchInput.focus();
      renderTimeline();
    });

    // 연대기 렌더링
    function renderTimeline() {
      const container = document.getElementById("timelineContainer");
      const filtered = DATA.filter(item => {
        const matchEra = selectedEra === "전체" || item.era === selectedEra;
        const matchCat = selectedCat === "전체" || item.category === selectedCat;
        const matchSearch = !searchQuery || [
          item.title,
          item.location,
          item.summary,
          item.detail,
          ...item.keywords
        ].some(text => text.toLowerCase().includes(searchQuery));
        return matchEra && matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">검색어나 필터 조건에 해당하는 항목이 없습니다.<br>다른 키워드나 시대·주제를 선택해 보세요.</div>`;
        return;
      }

      const erasToShow = ERA_ORDER.filter(era => filtered.some(item => item.era === era));

      let html = `<div class="timeline">`;
      erasToShow.forEach(era => {
        const items = filtered.filter(i => i.era === era);
        html += `
          <div class="era-section">
            <h2 class="era-heading">${era}</h2>
            <div class="card-grid">
              ${items.map(item => {
                const isStamped = stampedIds.includes(item.id);
                return `
                  <article class="card ${isStamped ? 'stamped' : ''}" onclick="openModal('${item.id}')">
                    <span class="stamp-mark">탐험완료</span>
                    <div>
                      <div class="card-badges">
                        <span class="badge badge-cat">${item.category}</span>
                        <span class="badge badge-year">${item.year}</span>
                      </div>
                      <h3>${item.title}</h3>
                      <p>${item.summary}</p>
                    </div>
                    <div class="card-footer">
                      <span>${item.location}</span>
                      <span>자세히 보기 &rarr;</span>
                    </div>
                  </article>
                `;
              }).join("")}
            </div>
          </div>
        `;
      });
      html += `</div>`;
      container.innerHTML = html;
    }

    // 필터 클릭 이벤트
    document.getElementById("eraFilters").addEventListener("click", e => {
      if (!e.target.classList.contains("chip")) return;
      selectedEra = e.target.dataset.era;
      document.querySelectorAll("#eraFilters .chip").forEach(c => c.classList.remove("active-era"));
      e.target.classList.add("active-era");
      renderTimeline();
    });

    document.getElementById("catFilters").addEventListener("click", e => {
      if (!e.target.classList.contains("chip")) return;
      selectedCat = e.target.dataset.cat;
      document.querySelectorAll("#catFilters .chip").forEach(c => c.classList.remove("active-cat"));
      e.target.classList.add("active-cat");
      renderTimeline();
    });

    // 모달 열기/닫기
    window.openModal = function(id) {
      const item = DATA.find(d => d.id === id);
      if (!item) return;
      currentModalId = id;

      document.getElementById("modalBadges").innerHTML = `
        <span class="badge badge-era">${item.era}</span>
        <span class="badge badge-cat">${item.category}</span>
        <span class="badge badge-year">${item.year}</span>
      `;
      document.getElementById("modalTitle").textContent = item.title;
      document.getElementById("modalMeta").textContent = `위치/관련지: ${item.location}`;
      document.getElementById("modalDesc").textContent = item.detail;
      document.getElementById("modalKeywords").innerHTML = item.keywords.map(k => `<span class="keyword">#${k}</span>`).join("");

      updateStampButton();
      document.getElementById("modalOverlay").classList.add("open");
    };

    function updateStampButton() {
      const btn = document.getElementById("btnStamp");
      const isDone = stampedIds.includes(currentModalId);
      btn.textContent = isDone ? "탐험 완료! (클릭 시 취소)" : "탐험 완료 도장 찍기";
      btn.classList.toggle("done", isDone);
    }

    document.getElementById("btnStamp").addEventListener("click", () => {
      if (!currentModalId) return;
      if (stampedIds.includes(currentModalId)) {
        stampedIds = stampedIds.filter(id => id !== currentModalId);
      } else {
        stampedIds.push(currentModalId);
      }
      saveStamps();
      updateStampButton();
      renderTimeline();
    });

    document.getElementById("modalClose").addEventListener("click", () => {
      document.getElementById("modalOverlay").classList.remove("open");
    });

    document.getElementById("modalOverlay").addEventListener("click", e => {
      if (e.target.id === "modalOverlay") {
        document.getElementById("modalOverlay").classList.remove("open");
      }
    });

    // 탭 전환
    document.querySelectorAll(".nav-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const target = tab.dataset.tab;
        document.getElementById("tab-timeline").classList.toggle("hidden", target !== "timeline");
        document.getElementById("tab-quiz").classList.toggle("hidden", target !== "quiz");
        if (target === "quiz") startQuiz();
      });
    });

    // 퀴즈 로직
    let quizList = [];
    let quizIdx = 0;
    let quizScore = 0;

    function startQuiz() {
      quizList = [...DATA].sort(() => Math.random() - 0.5).slice(0, 5);
      quizIdx = 0;
      quizScore = 0;
      renderQuiz();
    }

    function renderQuiz() {
      const box = document.getElementById("quizBox");
      if (quizIdx >= quizList.length) {
        box.innerHTML = `
          <div style="text-align:center; padding: 1.5rem 0;">
            <h2 style="font-family:'Noto Serif KR',serif; margin-bottom:0.6rem;">퀴즈 완료!</h2>
            <p style="font-size:1.1rem; margin-bottom:1.4rem;">총 ${quizList.length}문제 중 <strong>${quizScore}문제</strong>를 맞혔습니다.</p>
            <button class="nav-tab active" onclick="resetQuizUI()">다시 도전하기</button>
          </div>
        `;
        return;
      }

      const q = quizList[quizIdx];
      document.getElementById("quizCounter").textContent = `문제 ${quizIdx + 1} / ${quizList.length}`;
      document.getElementById("quizScore").textContent = `점수: ${quizScore}`;
      document.getElementById("quizQuestion").textContent = `[${q.category}] "${q.title}"은(는) 어느 시대의 문화유산(또는 인물)일까요?`;
      document.getElementById("quizFeedback").textContent = "";
      document.getElementById("btnNextQuiz").style.display = "none";

      const optsEl = document.getElementById("quizOptions");
      optsEl.innerHTML = ERA_ORDER.map(era => `
        <button class="quiz-opt" onclick="checkAnswer(this, '${era}', '${q.era}', '${q.summary.replace(/'/g, "\\'")}')">${era}</button>
      `).join("");
    }

    window.checkAnswer = function(btn, chosen, answer, hint) {
      document.querySelectorAll(".quiz-opt").forEach(b => b.disabled = true);
      const fb = document.getElementById("quizFeedback");
      if (chosen === answer) {
        btn.classList.add("correct");
        quizScore++;
        fb.style.color = "#1E5638";
        fb.textContent = `정답입니다! (${hint})`;
      } else {
        btn.classList.add("wrong");
        document.querySelectorAll(".quiz-opt").forEach(b => {
          if (b.textContent === answer) b.classList.add("correct");
        });
        fb.style.color = "#A94438";
        fb.textContent = `아쉽네요! 정답은 '${answer}'입니다.`;
      }
      document.getElementById("quizScore").textContent = `점수: ${quizScore}`;
      document.getElementById("btnNextQuiz").style.display = "inline-block";
    };

    document.getElementById("btnNextQuiz").addEventListener("click", () => {
      quizIdx++;
      renderQuiz();
    });

    window.resetQuizUI = function() {
      document.getElementById("quizBox").innerHTML = `
        <div class="quiz-status">
          <span id="quizCounter"></span>
          <span id="quizScore"></span>
        </div>
        <div class="quiz-question" id="quizQuestion"></div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <button class="btn-next" id="btnNextQuiz">다음 문제</button>
      `;
      document.getElementById("btnNextQuiz").addEventListener("click", () => {
        quizIdx++;
        renderQuiz();
      });
      startQuiz();
    };

    // 초기 실행
    updateProgress();
    renderTimeline();
  </script>
</body>
</html>
